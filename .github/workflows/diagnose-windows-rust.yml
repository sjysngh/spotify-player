name: Diagnose Windows Rust CI

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Seed once first; measure restores that cache without updating it
        type: choice
        options: [measure, seed]
        default: measure
        required: true

permissions:
  contents: read

concurrency:
  group: diagnose-windows-rust-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_FEATURES: rodio-backend,media-control,image,notify,fzf

jobs:
  windows:
    name: Windows ${{ matrix.cpu }} CPU (${{ inputs.cache_mode }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cpu: 2
            family: m8azn.large
          - cpu: 4
            family: m8azn.xlarge
    runs-on: runs-on=${{ github.run_id }}-windows-${{ matrix.cpu }}/family=${{ matrix.family }}/image=windows25-full-x64/extras=s3-cache/spot=false/env=demo
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cargo home
        id: cargo_home
        shell: bash
        run: |
          cargo_home="$(cygpath -m "${CARGO_HOME:-$HOME/.cargo}")"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "path=$cargo_home" >> "$GITHUB_OUTPUT"
      - uses: runs-on/action@v2
      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt
      - name: Restore diagnostic cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.cargo_home.outputs.path }}/registry/index/
            ${{ steps.cargo_home.outputs.path }}/registry/cache/
            ${{ steps.cargo_home.outputs.path }}/git/db/
            target/
          key: windows-diagnostic-v1-${{ matrix.cpu }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          fail-on-cache-miss: ${{ inputs.cache_mode == 'measure' }}
      - name: Record cache state
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-diagnostics" | Out-Null
          @{ utc = [DateTime]::UtcNow.ToString('o'); phase = 'cache-restore'; event = 'end'; hit = $env:CACHE_HIT; key = $env:CACHE_KEY } |
            ConvertTo-Json -Compress | Add-Content "$env:RUNNER_TEMP/windows-diagnostics/phases.jsonl"
          "Cache hit: $env:CACHE_HIT (mode: ${{ inputs.cache_mode }})" >> $env:GITHUB_STEP_SUMMARY
      - name: Cargo format
        run: ./scripts/windows-diagnostics.ps1 -Mode Run -Phase format -CargoArguments @('fmt', '--all', '--', '--check')
      - name: Cargo test
        run: ./scripts/windows-diagnostics.ps1 -Mode Run -Phase test -CargoArguments @('test', '--locked', '--timings', '--no-default-features', '--features', $env:RUST_FEATURES)
      - name: Cargo clippy with benchmark features
        run: ./scripts/windows-diagnostics.ps1 -Mode Run -Phase clippy-features -CargoArguments @('clippy', '--locked', '--timings', '--no-default-features', '--features', $env:RUST_FEATURES, '--', '-D', 'warnings')
      - name: Cargo clippy without features
        run: ./scripts/windows-diagnostics.ps1 -Mode Run -Phase clippy-core -CargoArguments @('clippy', '--locked', '--timings', '--no-default-features', '--', '-D', 'warnings')
      - name: Save seed cache
        if: success() && inputs.cache_mode == 'seed' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.cargo_home.outputs.path }}/registry/index/
            ${{ steps.cargo_home.outputs.path }}/registry/cache/
            ${{ steps.cargo_home.outputs.path }}/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.cpu }}cpu-${{ inputs.cache_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-diagnostics/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
